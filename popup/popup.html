<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../assets/styles/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="brand">
        <img src="../assets/icons/icon-32.png" alt="" class="brand-logo" width="28" height="28">
        <div class="brand-copy">
          <h1 id="title" class="brand-title">Filmweb Helper</h1>
          <p id="subtitle" class="brand-subtitle"></p>
        </div>
      </div>
    </header>

    <main class="popup-main">
      <button id="randomBtn" class="btn btn-primary" type="button">
        <span id="randomText">Pick Random Movie</span>
      </button>

      <section id="result" class="result" hidden></section>
    </main>

    <footer class="popup-footer">
      <button id="optionsBtn" class="btn btn-ghost" type="button">Settings</button>
    </footer>
  </div>
  <script src="../lib/browser-global.js"></script>
  <script src="popup.js"></script>
</body>
</html>
