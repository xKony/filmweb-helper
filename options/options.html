<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Filmweb Helper Settings</title>
  <link rel="stylesheet" href="../assets/styles/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="pageTitle">Filmweb Helper Settings</h1>
    </header>

    <main>
      <section class="setting-group">
        <label class="switch-container">
          <input type="checkbox" id="hideRatings">
          <span class="label-text" id="hideRatingsLabel">Hide ratings for unwatched movies</span>
        </label>
        <p class="setting-description" id="hideRatingsDescription"></p>
      </section>

      <section class="setting-group">
        <label class="switch-container">
          <input type="checkbox" id="subtitlesLinkEnabled" checked>
          <span class="label-text" id="subtitlesLinkLabel">Show OpenSubtitles download link</span>
        </label>
        <p class="setting-description" id="subtitlesLinkDescription"></p>

        <label class="field-label" for="subtitleLanguage" id="subtitleLanguageLabel">Subtitle language</label>
        <select id="subtitleLanguage" class="select-input">
          <option value="pol" id="subtitleLanguagePolishOption">Polish</option>
          <option value="eng" id="subtitleLanguageEnglishOption">English</option>
        </select>
      </section>

      <section class="actions">
        <button id="saveBtn" class="primary-btn">Save Settings</button>
        <span id="status" class="status-msg"></span>
      </section>
    </main>
  </div>
  <script src="../lib/browser-global.js"></script>
  <script src="options.js"></script>
</body>
</html>
